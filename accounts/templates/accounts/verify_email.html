{% extends 'base.html' %}
{% block title %}التحقق من البريد — Nexora{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card" style="max-width:480px;margin:0 auto;">
    <div class="auth-header">
      <div class="auth-logo">Nexora<span>.</span></div>
      <h1>التحقق من البريد</h1>
      <p>أرسلنا لك رابط تحقق إلى {{ user.email }}</p>
    </div>
    <form method="post" class="auth-form">
      {% csrf_token %}
      <button type="submit" class="btn-primary btn-block">
        <i class="fas fa-envelope"></i> إعادة إرسال الرابط
      </button>
    </form>
  </div>
</section>
{% endblock %}
