{% extends 'base.html' %}
{% block content %}
<section class="page-head"><div class="container">
  <h1>🤖 ولّد موقعك</h1>
  <p>اختر الثيم واكتب الوصف، ودع الذكاء الاصطناعي يبني 3 صفحات كاملة</p>
</div></section>
<section class="section"><div class="container narrow">
  <form method="post" class="project-form">{% csrf_token %}
    {% for field in form %}
    <div class="field"><label>{{ field.label }}</label>{{ field }}</div>
    {% endfor %}
    <button type="submit" class="btn-primary btn-block">✨ توليد الموقع</button>
  </form>
</div></section>
{% endblock %}
